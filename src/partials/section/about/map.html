<section
  class="
    relative
    w-full
    h-screen
    py-12
    px-4
    bg-muted-100
    dark:bg-muted-900
    overflow-hidden
  "
>
  <!--Pill nav-->
  <div
    class="
      absolute
      top-4
      inset-x-0
      w-60
      rounded-full
      mx-auto
      p-2
      bg-white
      dark:bg-muted-900
      shadow-xl shadow-muted-400/10
      dark:shadow-muted-800/10
      z-10
    "
  >
    <div
      class="
        w-full
        flex
        font-medium
        items-center
        justify-between
        gap-4
        text-muted-900
        dark:text-muted-100
      "
    >
      <!--Home link-->
      <a
        href="/"
        class="
          flex
          items-center
          justify-center
          h-14
          w-14
          rounded-full
          text-muted-400
          hover:text-primary-500
          border border-muted-200
          dark:border-muted-700
          hover:border-primary-500
          dark:hover:border-primary-500
          hover:shadow-xl
          shadow-muted-400/10
          dark:hover:shadow-muted-800/10
          transition-all
          duration-300
        "
      >
        <i class="iconify w-6 h-6" data-icon="ph:house-duotone"></i>
      </a>
      <!--Site name-->
      <span class="font-heading font-bold text-2xl">Mistral</span>
      <!--Theme toggler-->
      <div
        class="
          flex
          items-center
          justify-center
          h-14
          w-14
          rounded-full
          bg-muted-100
          dark:bg-muted-800
        "
      >
        {{> theme/theme-toggler}}
      </div>
    </div>
  </div>

  <!--Map body-->
  <div class="absolute inset-0 bg-muted-300 dark:bg-muted-900">
    <iframe
      width="100%"
      height="100%"
      frameborder="0"
      marginheight="0"
      marginwidth="0"
      title="map"
      scrolling="no"
      src="https://maps.google.com/maps?width=100%&amp;height=600&amp;hl=en&amp;q=Los%20Angeles+(Css%20Ninja)&amp;ie=UTF8&amp;t=&amp;z=14&amp;iwloc=B&amp;output=embed"
      style="filter: grayscale(1) contrast(1.2) opacity(0.4)"
    ></iframe>
  </div>
  <div class="w-full max-w-7xl px-5 py-24 mx-auto flex">
    <!--Contact form-->
    <div
      class="
        lg:w-1/3
        md:w-1/2
        bg-white
        dark:bg-muted-800
        rounded-lg
        p-8
        flex flex-col
        md:ml-auto
        w-full
        mt-10
        md:mt-0
        relative
        shadow-xl shadow-muted-400/10
        dark:shadow-muted-800/10
        z-10
      "
    >
      <h2
        class="
          font-heading
          text-muted-800
          dark:text-white
          text-xl
          mb-1
          font-medium
        "
      >
        Reach us
      </h2>
      <p
        class="font-sans leading-tight mb-5 text-muted-500 dark:text-muted-400"
      >
        Have any questions? Or you simply want to say hello? Use the form below.
      </p>
      <input
        class="
          bg-white
          dark:bg-muted-700
          rounded
          border border-muted-300
          dark:border-muted-500
          focus:shadow-xl focus:shadow-muted-400/10
          dark:focus:shadow-muted-800/10
          placeholder:text-muted-300
          dark:placeholder:text-muted-500
          text-base text-muted-600
          dark:text-muted-200
          px-4
          py-2
          mb-4
          transition-all
          duration-300
          tw-accessibility
        "
        placeholder="Email address"
        type="email"
      />
      <textarea
        class="
          bg-white
          dark:bg-muted-700
          rounded
          border border-muted-300
          dark:border-muted-500
          focus:shadow-xl focus:shadow-muted-400/10
          dark:focus:shadow-muted-800/10
          placeholder:text-muted-300
          dark:placeholder:text-muted-500
          text-base text-muted-600
          dark:text-muted-200
          h-32
          px-4
          py-2
          mb-4
          resize-none
          transition-all
          duration-300
          tw-accessibility
        "
        placeholder="Message"
      ></textarea>
      <button
        class="
          font-sans
          text-white
          bg-primary-500
          border-0
          py-3
          px-6
          focus:outline-none
          hover:bg-primary-600
          rounded
          text-base
          hover:shadow-xl hover:shadow-primary-500/20
          transition-all
          duration-300
        "
      >
        Send Message
      </button>
      <p class="font-sans text-xs text-muted-400 mt-3">
        Someone from our team will respond as soon as possible. We won't share
        your address with anyone.
      </p>
    </div>
  </div>
</section>
