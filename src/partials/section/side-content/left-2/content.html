<section class="w-full py-12 px-4 bg-white dark:bg-muted-900 overflow-hidden">
  <div class="w-full max-w-7xl mx-auto">
    <!--Wrapper-->
    <div class="flex flex-col-reverse md:flex-row items-center py-6 -m-3">
      <!--Column-->
      <div class="w-full md:w-1/2 relative p-6">
        <!--Feature-->
        {{> section/side-content/left-2/feature}}
      </div>
      <!--Column-->
      <div class="w-full md:w-1/2 relative p-6">
        <!--Section content-->
        <div class="w-full max-w-lg space-y-4">
          <!--Badge-->
          <span
            class="
              inline-block
              font-sans
              text-xs
              py-1.5
              px-3
              m-1
              rounded-lg
              bg-indigo-100
              text-indigo-500
              dark:bg-indigo-500 dark:text-white
            "
          >
            Reporting tools
          </span>
          <!--Title-->
          <h2
            class="
              font-heading font-bold
              text-4xl text-muted-800
              dark:text-white
            "
          >
            Our metrics and statistics speak for us
          </h2>
          <!--Subtitle-->
          <p class="font-sans text-lg text-muted-500 dark:text-muted-400">
            Lorem ipsum dolor sit amet, consectetur adipiscing elit. Tum
            Torquatus: Prorsus, inquit, assentior; Videmus igitur ut
            conquiescere.
          </p>
          <!--Link-->
          <a
            href="#"
            class="
              group
              inline-flex
              items-center
              gap-4
              text-primary-500
              hover:text-primary-400
              transition-colors
              duration-300
            "
          >
            <span class="font-sans font-medium text-sm">See how it works</span>
            <i
              class="
                iconify
                w-4
                h-4
                group-hover:translate-x-1
                transition-transform
                duration-300
              "
              data-icon="lucide:arrow-right"
            ></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
